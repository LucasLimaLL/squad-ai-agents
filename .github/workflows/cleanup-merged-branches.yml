name: Cleanup de branches após merge

# Não habilite o "Automatically delete head branches" nativo do GitHub neste
# repositório: ele deletaria a branch assim que a primeira PR fechasse, o que
# quebra o caso de fix/** (mesma branch alimenta duas PRs em paralelo —
# fix/xxx -> develop e fix/xxx -> main). Este workflow deleta a branch head
# só depois que TODAS as PRs abertas a partir dela estiverem fechadas, e
# também limpa a branch chore/** correspondente quando o feature/** espelhado
# é mergeado.

on:
  pull_request:
    types: [closed]
    branches:
      - develop
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deleta a branch head, se não houver outra PR aberta usando ela
        run: |
          OTHER_OPEN=$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq 'length')
          if [ "$OTHER_OPEN" -gt 0 ]; then
            echo "Branch $HEAD_BRANCH ainda tem $OTHER_OPEN PR(s) aberta(s) (ex.: fix/** com PR paralela para develop e main) — não deletando ainda."
          elif git ls-remote --exit-code --heads origin "$HEAD_BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$HEAD_BRANCH"
            echo "Branch $HEAD_BRANCH deletada."
          else
            echo "Branch $HEAD_BRANCH já não existe no remoto."
          fi

      - name: Deleta a branch chore correspondente, se existir
        run: |
          case "$HEAD_BRANCH" in
            feature/*)
              DESCRIPTION="${HEAD_BRANCH#feature/}"
              CHORE_BRANCH="chore/${DESCRIPTION}"
              if git ls-remote --exit-code --heads origin "$CHORE_BRANCH" >/dev/null 2>&1; then
                git push origin --delete "$CHORE_BRANCH"
                echo "Branch $CHORE_BRANCH deletada (origem do feature mergeado)."
              else
                echo "Não existe branch $CHORE_BRANCH para limpar."
              fi
              ;;
            *)
              echo "Head branch não é feature/**, nada de chore/** para limpar."
              ;;
          esac
