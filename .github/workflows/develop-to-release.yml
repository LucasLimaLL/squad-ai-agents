name: Develop → Release → Main

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-develop
  cancel-in-progress: false

jobs:
  cut-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Configura git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calcula a próxima versão semântica
        id: version
        run: |
          set -e
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)

          if [ -z "$LAST_TAG" ]; then
            BASE_VERSION="0.0.0"
            RANGE="HEAD"
          else
            BASE_VERSION="${LAST_TAG#v}"
            RANGE="${LAST_TAG}..HEAD"
          fi

          git log --pretty=format:'%s%n%b' $RANGE > commits.txt

          if [ ! -s commits.txt ]; then
            echo "Nenhum commit novo desde ${LAST_TAG:-o início} — nada para lançar."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Convenção: breaking:/BREAKING CHANGE:/tipo! => major, feat: => minor, fix: (ou default) => patch
          BUMP="patch"
          if grep -qiE '^(breaking:|BREAKING CHANGE:)|^[a-z]+(\([^)]*\))?!:' commits.txt; then
            BUMP="major"
          elif grep -qiE '^feat(\([^)]*\))?:' commits.txt; then
            BUMP="minor"
          elif grep -qiE '^fix(\([^)]*\))?:' commits.txt; then
            BUMP="patch"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          git log --pretty='- %s (%h)' --no-merges $RANGE > changelog.txt

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Verifica se a branch de release já existe
        if: steps.version.outputs.skip != 'true'
        id: check_release
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          BRANCH="release/$NEW_VERSION"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cria branch de release e tag
        if: steps.version.outputs.skip != 'true' && steps.check_release.outputs.exists == 'false'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          BRANCH="release/$NEW_VERSION"
          git checkout -b "$BRANCH"
          git tag "$NEW_VERSION"
          git push origin "$BRANCH"
          git push origin "$NEW_VERSION"

      - name: Abre PR de release para main
        if: steps.version.outputs.skip != 'true' && steps.check_release.outputs.exists == 'false'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          BUMP: ${{ steps.version.outputs.bump }}
        run: |
          BRANCH="release/$NEW_VERSION"
          {
            echo "## Release $NEW_VERSION"
            echo ""
            echo "Bump: **$BUMP**"
            echo ""
            echo "### Mudanças incluídas"
            cat changelog.txt
            echo ""
            echo "---"
            echo "Aberto automaticamente pelo workflow \`develop-to-release\`. Merge nesta PR é sempre humano."
          } > pr_body.md
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release $NEW_VERSION" \
            --body-file pr_body.md \
            --reviewer LucasLimaLL
